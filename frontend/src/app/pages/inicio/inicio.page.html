<ion-content>
  <main class="welcome-screen">
    <section class="hero" aria-label="Histórias de cuidado" aria-roledescription="carrossel">
      @for (slide of slides; track slide.image; let i = $index) {
      <div class="hero-slide" [class.active]="activeSlide() === i" [attr.aria-hidden]="activeSlide() !== i">
        <img [src]="slide.image" [alt]="slide.alt" [attr.fetchpriority]="i === 0 ? 'high' : 'auto'" />
      </div>
      }
      <div class="carousel-controls">
        <div class="dots" aria-label="Escolher imagem">
          @for (slide of slides; track slide.image; let i = $index) {
          <button
            type="button"
            [class.selected]="activeSlide() === i"
            [attr.aria-label]="'Mostrar imagem ' + (i + 1)"
            [attr.aria-pressed]="activeSlide() === i"
            (click)="selectSlide(i)"
          >
            <span></span>
          </button>
          }
        </div>
      </div>
    </section>
    <section class="access-panel" aria-label="Acesso ao aplicativo">
      <div class="welcome-brand">
        <img src="assets/icon/cuidado.svg" width="48" height="48" alt="" />
        <h1>Assistente<br />de Cuidados</h1>
      </div>
      <p class="welcome-subtitle">Cuidar aproxima.</p>
      <a class="access-button login-button" routerLink="/login">Entrar com e-mail <span aria-hidden="true">→</span></a>
      <div class="signup">
        <p>Ainda não possui uma conta?</p>
        <a class="access-button signup-button" routerLink="/cadastro">Criar conta</a>
      </div>
    </section>
  </main>
</ion-content>
